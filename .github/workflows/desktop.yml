# Desktop builds (docs/desktop.md): macOS (universal .dmg) and Windows (.exe
# installer) via Tauri. A pushed `v*` tag creates a draft GitHub Release with
# the installers; a manual run uploads them as workflow artifacts.
#
# The builds ship code only. They never run `npm run fetch-cards`, and
# `vite build --mode desktop` drops any STCC data; the app downloads its own
# copy of the card database on first launch.

name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    env:
      # online play and invite links point at the hosted game (Settings →
      # Secrets and variables → Actions → Variables)
      VITE_PUBLIC_URL: ${{ vars.READY_ROOM_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      - name: Build and release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ready Room ${{ github.ref_name }}
          releaseBody: |
            Unofficial desktop build of Ready Room. On first launch the app downloads the STCC card database (about 340 MB) onto your computer; it is not part of this download.

            The builds are not code-signed. macOS: right-click the app → Open (or System Settings → Privacy & Security → Open Anyway). Windows: SmartScreen → More info → Run anyway.
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Build (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx tauri build ${{ matrix.args }}

      - name: Check no card data was bundled
        shell: bash
        run: |
          if [ -e dist/stcc ]; then echo "dist/stcc must not exist in a desktop build"; exit 1; fi

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ready-room-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
