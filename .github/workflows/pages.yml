# The web version on GitHub Pages — for iPads and other browsers, opened from
# https://<owner>.github.io/<repo>/ (Safari: Share → Add to Home Screen runs it
# full-screen). Rebuilt on every push to main.
#
# Like the hosted build (docs/deploy.md) it ships code only: `--mode hosted`
# never bundles the STCC database or card scans, so cards show as text.
# There is no game server here, so play is local (hot-seat or against the Bot).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --mode hosted --base "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
