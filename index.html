<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#05050a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<meta name="apple-mobile-web-app-title" content="Ready Room" />
		<link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
		<link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
		<title>Ready Room</title>
		<link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
		<link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />
		<!-- the stored LCARS theme (src/ui/theme.ts), applied before first paint
		     so a reload never flashes the default palette -->
		<script>
			try {
				var t = localStorage.getItem('ready-room.theme')
				var g = {
					'lcars-blue': '#04060f',
					voyager: '#07060f',
					'enterprise-e': '#05070a',
				}[t]
				if (g) {
					document.documentElement.dataset.theme = t
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute('content', g)
				}
			} catch (e) {}
		</script>
		<script>
			// This runs even if a cached page points to a bundle that cannot load.
			window.addEventListener('load', function () {
				setTimeout(function () {
					var root = document.getElementById('root')
					if (!root || !root.querySelector('.boot')) return
					root.textContent = 'Ready Room could not finish loading. '
					var retry = document.createElement('button')
					retry.textContent = 'Update and retry'
					retry.onclick = function () {
						if (!navigator.serviceWorker) return location.reload()
						navigator.serviceWorker
							.getRegistration()
							.then(function (reg) {
								if (!reg) return location.reload()
								return reg.update().then(function () {
									setTimeout(function () {
										location.reload()
									}, 3000)
								})
							})
							.catch(function () {
								location.reload()
							})
					}
					root.appendChild(retry)
				}, 15000)
			})
			navigator.serviceWorker &&
				navigator.serviceWorker.addEventListener('message', function (event) {
					if (
						event.data &&
						event.data.type === 'ready-room-updated' &&
						document.querySelector('#root .boot')
					)
						location.reload()
				})
		</script>
		<!-- first-paint loader: the bundle can take seconds on a phone; React
		     replaces #root's children on its first render -->
		<style>
			html,
			body {
				margin: 0;
				background: #05050a;
			}
			html[data-theme='lcars-blue'] body {
				background: #04060f;
			}
			html[data-theme='voyager'] body {
				background: #07060f;
			}
			html[data-theme='enterprise-e'] body {
				background: #05070a;
			}
			html[data-theme] .boot-title {
				color: #9db8ee;
			}
			.boot {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 18px;
				color: #9a93a8;
				font:
					500 14px/1 'Antonio',
					'Arial Narrow',
					sans-serif;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			.boot-title {
				color: #ff9c00;
				font-size: 22px;
				letter-spacing: 0.06em;
			}
			.boot-bar {
				width: 160px;
				height: 6px;
				border-radius: 3px;
				background: #1e2231;
				overflow: hidden;
			}
			.boot-bar::after {
				content: '';
				display: block;
				width: 40%;
				height: 100%;
				border-radius: 3px;
				background: #9c9cff;
				animation: boot-sweep 1.1s ease-in-out infinite alternate;
			}
			@keyframes boot-sweep {
				to {
					transform: translateX(150%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.boot-bar::after {
					width: 100%;
					animation: none;
					opacity: 0.6;
				}
			}
		</style>
	</head>
	<body>
		<div id="root">
			<div class="boot" role="status">
				<div class="boot-title">Ready Room</div>
				<div class="boot-bar"></div>
				<div>Loading</div>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
